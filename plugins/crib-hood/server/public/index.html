<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Crib Hood</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏠 The Crib Hood</h1>
    <div class="status-bar">
      <button class="theme-toggle" id="theme-toggle" title="Switch character style">
        <span id="theme-icon">🎮</span>
        <span id="theme-label">Original</span>
      </button>
      <span class="live-indicator">● Live</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <main>
    <section class="mode-banner" id="mode-banner" hidden>
      <span class="mode-name" id="mode-name"></span>
      <span class="mode-phase" id="mode-phase"></span>
    </section>

    <section class="agent-grid" id="agent-grid">
      <div class="empty-state" id="empty-state">
        <p>No agents running</p>
        <p class="hint">Start an OMC workflow to see agents here</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="summary" id="summary">
      <span class="stat working">Working: <strong id="count-working">0</strong></span>
      <span class="stat pending">Pending: <strong id="count-pending">0</strong></span>
      <span class="stat idle">Idle: <strong id="count-idle">0</strong></span>
      <span class="stat completed">Completed: <strong id="count-completed">0</strong></span>
      <span class="stat error">Error: <strong id="count-error">0</strong></span>
      <span class="stat total">Total: <strong id="count-total">0</strong></span>
    </div>
  </footer>

  <script src="characters.js"></script>
  <script src="app.js"></script>
</body>
</html>
